<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="header">
  <div class="tabs">
    <button id="tabPictures" class="tab active">Pictures</button>
    <button id="tabAlbums" class="tab">Albums</button>
  </div>
  <button id="menuBtn" class="iconBtn">
    <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
  </button>
</header>

<div id="menuPopup" class="popup hidden">
  <button class="popupItem" data-album="favourites">
    <svg viewBox="0 0 24 24"><path d="M12 21s-7-4.35-9.5-8.5C1 9 2.5 5.5 6 5c2-.3 3.5.8 4.5 2.3C11.5 5.8 13 4.7 15 5c3.5.5 5 4 3.5 7.5C19 16.65 12 21 12 21z" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
    Favourites
  </button>
  <button class="popupItem" data-album="recent">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M12 7v5l3.5 2" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
    Recent
  </button>
  <button class="popupItem" data-album="recycle">
    <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-9 0 1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Recycle bin
  </button>
</div>

<div id="toolbar" class="toolbar hidden">
  <button id="backBtn" class="iconBtn hidden">
    <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <span id="toolbarTitle"></span>
  <button id="selectBtn" class="textBtn">Select</button>
</div>

<main id="albumsView" class="albumsGrid hidden"></main>
<main id="grid" class="grid"></main>

<div id="bottomBar" class="bottomBar hidden">
  <button id="favSelBtn" class="iconBtn big">
    <svg viewBox="0 0 24 24"><path d="M12 21s-7-4.35-9.5-8.5C1 9 2.5 5.5 6 5c2-.3 3.5.8 4.5 2.3C11.5 5.8 13 4.7 15 5c3.5.5 5 4 3.5 7.5C19 16.65 12 21 12 21z" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
  </button>
  <button id="delSelBtn" class="iconBtn big">
    <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-9 0 1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</div>

<button id="addBtn" class="fab">
  <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>
</button>
<input type="file" id="fileInput" accept="image/png, image/jpeg" multiple class="hidden">

<div id="dropOverlay" class="dropOverlay hidden">Drop images to add</div>

<div id="modal" class="modalOverlay hidden">
  <div class="modalTop">
    <span id="modalExt" class="extBadge"></span>
    <button id="closeModal" class="iconBtn">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="modalImgWrap">
    <img id="modalImg" src="">
  </div>
  <div id="infoPanel" class="infoPanel hidden">
    <p id="infoDate"></p>
    <p id="infoAlbums"></p>
  </div>
  <div class="modalIcons">
    <button id="leftAction" class="iconBtn big"></button>
    <button id="infoBtn" class="iconBtn big">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M12 11v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="8" r="1" fill="currentColor"/></svg>
    </button>
    <button id="rightAction" class="iconBtn big"></button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
